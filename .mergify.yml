# Mergify: the policy lives in systemfsoftware/.github (.mergify.yml). This file only names this repository's checks.
extends: .github
queue_rules:
  - name: default
    queue_conditions:
      - check-success = checks / check
      # The squash message is the pull request's title and body; `squash-message.yml` lints it on the pull request.
      - check-success = squash message
    merge_conditions:
      - check-success = checks / check
