name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "true"
  VP_GIT_HOOKS: "0"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/workspace
        with:
          node-version: 24
          save-store: "true"
      - run: pnpm run patch:tsgo
      - run: pnpm run format:check
      - run: pnpm run lint
  build-and-pack:
    name: build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/workspace
        with:
          node-version: 24
      - run: pnpm run patch:tsgo
      - run: pnpm run check:types
      - run: pnpm run build
      - name: Every published package packs with its dist
        run: |
          set -euo pipefail
          for dir in packages/*; do
            name=$(jq -r .name "$dir/package.json")
            out=$(mktemp -d)
            pnpm --dir "$dir" pack --pack-destination "$out" >/dev/null
            tgz=$(ls "$out"/*.tgz)
            listing="$out/contents.txt"
            tar -tzf "$tgz" > "$listing"
            grep -qx 'package/package.json' "$listing"
            grep -qx 'package/dist/index.mjs' "$listing"
            echo "$name packs"
          done
  changeset:
    name: change intent
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@292288250ae39b491c79ce6818267972df71be7a
    permissions:
      contents: read
      pull-requests: read
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/workspace
        with:
          node-version: 24
      - run: pnpm run patch:tsgo
      - name: Configure Docker Hub mirror
        run: |
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path
          config_path = Path("/etc/docker/daemon.json")
          config = json.loads(config_path.read_text()) if config_path.exists() else {}
          mirrors = config.get("registry-mirrors", [])
          config["registry-mirrors"] = list(dict.fromkeys(["https://mirror.gcr.io", *mirrors]))
          config_path.parent.mkdir(parents=True, exist_ok=True)
          config_path.write_text(json.dumps(config))
          PYTHON
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: Test native containers with Docker
        run: |
          container_proxy_image=mirror.gcr.io/cloudflare/proxy-everything:3cb1195@sha256:0ef6716c52430096900b150d84a3302057d6cd2319dae7987128c85d0733e3c8
          if docker pull "$container_proxy_image"; then
            export MINIFLARE_CONTAINER_EGRESS_IMAGE="$container_proxy_image"
          fi
          pnpm run check:containers
      - name: Run tests
        run: pnpm run test
  nix:
    name: nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
      - name: The Nix workspace build produces the release tarballs
        run: nix build .#packages.x86_64-linux.workspace-tarballs
  check:
    name: checks / check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, build-and-pack, changeset, test, nix]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          BUILD_AND_PACK: ${{ needs.build-and-pack.result }}
          TEST: ${{ needs.test.result }}
          NIX: ${{ needs.nix.result }}
          CHANGESET: ${{ needs.changeset.result }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          status=0
          for pair in "lint:$LINT" "build-and-pack:$BUILD_AND_PACK" "test:$TEST" "nix:$NIX"; do
            case "$pair" in
              *:success) ;;
              *) echo "A required job finished as: $pair"; status=1 ;;
            esac
          done
          if [ "$CHANGESET" != success ]; then
            if [ "$CHANGESET" = skipped ] && { [ "$EVENT" != pull_request ] || [ "$HEAD_REF" = changeset-release/main ]; }; then
              :
            else
              echo "A required job finished as: changeset:$CHANGESET"
              status=1
            fi
          fi
          exit "$status"
