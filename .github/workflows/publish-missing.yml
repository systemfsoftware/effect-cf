name: Publish missing versions

# Recovery path for a release whose publish job failed after tagging: the shared workflow only
# publishes during a release phase, so a version that is tagged but absent from npm is never
# retried. This publishes every version the workspace tarballs carry that npm does not hold yet,
# and skips the ones it does, so it is safe to run at any time.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-missing
  cancel-in-progress: false

jobs:
  publish:
    name: publish missing versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=

      - name: Put Node.js on the PATH
        run: echo "$(nix build --no-link --print-out-paths nixpkgs#nodejs_26)/bin" >> "$GITHUB_PATH"

      # Same contract as the shared release workflow: upload every version npm lacks, one wait
      # afterwards so a partial upload is visible before the job reports success.
      - name: Publish every version npm does not hold yet
        run: |
          out=$(nix build --no-link --print-out-paths .#workspace-tarballs)
          published=()
          while read -r name file; do
            version=$(tar -xzOf "$out/$file" package/package.json | jq -r .version)
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")
            case "$status" in
              200) echo "$name@$version is on npm" ;;
              404)
                npx --yes pnpm@12.21.0 publish "$out/$file" --access public --no-git-checks
                published+=("$name@$version")
                ;;
              *) echo "::error::npm answered $status for $name@$version"; exit 1 ;;
            esac
          done < <(jq -r '.[] | "\(.name) \(.file)"' "$out/index.json")
          echo "PUBLISHED=${published[*]}" >> "$GITHUB_ENV"

      - name: Wait until every published version installs
        timeout-minutes: 30
        run: |
          for spec in $PUBLISHED; do
            name=${spec%@*} version=${spec##*@}
            until tarball=$(curl -sf "https://registry.npmjs.org/${name/\//%2f}/$version" | jq -er .dist.tarball) &&
              curl -sfI -o /dev/null "$tarball"; do
              sleep 10
            done
            echo "$spec installs"
          done
