name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@a7c8ca88d2ace4fb62bfeff20f594d11cffe3780
    with:
      # The release PR changes only version surfaces, so its own tree is proved by the merge-queue draft's full CI.
      # `release-checks.yml` reuses main's verdict for the base commit and lints the squash message instead of
      # rebuilding the matrix for a version bump.
      ci-workflow: release-checks.yml
      npm-publish: true
  noop:
    name: no release off main, so the run concludes success, not skipped
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "Release writes only from refs/heads/main; $GITHUB_REF runs nothing."
